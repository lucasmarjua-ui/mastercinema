<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MasterCinema: partida de trivia de cine contrarreloj.">
  <title>MasterCinema / Partida</title>
  <link rel="stylesheet" href="./shared/theme.css">
</head>
<body class="game-page">
  <main class="cinema-shell">
    <header class="topbar">
      <a class="brand" href="./index.html">MASTER<span>CINEMA</span></a>
      <div class="header-actions">
        <span class="wallet-pill"><span class="reel-coin" aria-hidden="true"></span><span id="wallet-count">0</span> bobinas</span>
        <button id="sound-toggle" class="icon-btn" type="button">Sonido: ON</button>
        <a class="btn btn-ghost" href="./index.html">Cambiar categoría</a>
      </div>
    </header>
    <section id="quiz-panel">
      <div class="game-header">
        <span class="pill" id="category-label">Categoría</span>
        <span class="pill" id="question-counter">Pregunta 1/10</span>
        <span class="pill" id="score-label">Puntos: 0</span>
      </div>
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="question-card">
        <h2 id="question-text">Cargando pregunta...</h2>
      </div>
      <div class="answers-grid" id="answers-grid"></div>
    </section>
    <section class="results-panel" id="results-panel" hidden>
      <span class="eyebrow">Fin de la función</span>
      <h2>Resultados</h2>
      <div class="results-stats">
        <div class="stat-block"><strong id="result-correct">0</strong><span>Aciertos</span></div>
        <div class="stat-block"><strong id="result-wrong">0</strong><span>Fallos</span></div>
        <div class="stat-block"><strong id="result-score">0</strong><span>Puntuación</span></div>
        <div class="stat-block"><strong id="result-reels">0</strong><span>Bobinas ganadas</span></div>
      </div>
      <p id="leaderboard-note" class="modal-error" style="color:var(--gold-bright)"></p>
      <div class="results-actions">
        <button class="btn btn-gold" id="play-again" type="button">Jugar de nuevo</button>
        <a class="btn btn-ghost" href="./index.html">Cambiar categoría</a>
        <button class="trophy-btn" id="trophy-open" type="button">Ver logros</button>
      </div>
    </section>
    <footer class="footer">
      <span>MASTERCINEMA © 2026</span>
      <span>Responde antes de que se apague la luz</span>
    </footer>
  </main>
  <div class="wipe-bar" id="wipe-bar" aria-hidden="true"></div>

  <div class="modal-backdrop" id="achievement-modal" hidden>
    <section class="modal-card modal-wide">
      <button class="modal-close" id="achievement-close" type="button">X</button>
      <h2>Logros</h2>
      <ul class="ach-list" id="achievement-list"></ul>
    </section>
  </div>

  <script type="module">
    import { QUESTIONS } from './shared/questions.js';
    import { buildRound, computeScore, TIME_LIMIT_MS, ROUND_SIZE } from './shared/quiz-engine.js';
    import { Wallet, reelsForScore } from './shared/wallet.js';
    import { applyTheme } from './shared/themes.js';
    import { Audio } from './shared/audio.js';
    import { loadStats, saveStats, recordAnswer, recordRoundEnd, getAchievementState, ACHIEVEMENTS } from './shared/achievements.js';
    import { getCurrentUser } from './shared/auth.js';
    import { submitScore } from './shared/leaderboard.js';

    applyTheme();

    const params = new URLSearchParams(window.location.search);
    const requested = params.get('cat');
    const categoryKey = requested && QUESTIONS[requested] ? requested : 'directors';
    const category = QUESTIONS[categoryKey];

    const categoryLabel = document.querySelector('#category-label');
    const questionCounter = document.querySelector('#question-counter');
    const scoreLabel = document.querySelector('#score-label');
    const timerFill = document.querySelector('#timer-fill');
    const questionText = document.querySelector('#question-text');
    const answersGrid = document.querySelector('#answers-grid');
    const quizPanel = document.querySelector('#quiz-panel');
    const resultsPanel = document.querySelector('#results-panel');
    const resultCorrect = document.querySelector('#result-correct');
    const resultWrong = document.querySelector('#result-wrong');
    const resultScore = document.querySelector('#result-score');
    const resultReels = document.querySelector('#result-reels');
    const leaderboardNote = document.querySelector('#leaderboard-note');
    const wipeBar = document.querySelector('#wipe-bar');
    const walletCount = document.querySelector('#wallet-count');

    categoryLabel.textContent = category.label;

    const renderWallet = () => { walletCount.textContent = Wallet.get(); };
    renderWallet();
    window.addEventListener('walletchange', renderWallet);

    const soundButton = document.querySelector('#sound-toggle');
    const renderSound = () => { soundButton.textContent = `Sonido: ${Audio.isMuted() ? 'OFF' : 'ON'}`; };
    renderSound();
    soundButton.addEventListener('click', () => { Audio.toggleMute(); renderSound(); });

    let round = [];
    let index = 0;
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let ratios = [];
    let timerId = null;
    let deadline = 0;
    let answered = false;
    let stats = loadStats();

    // Cortinilla de cine: barrido oscuro que cubre la pantalla, cambia el
    // contenido a mitad de camino y se retira.
    function wipeTransition(swapFn) {
      return new Promise(resolve => {
        wipeBar.classList.remove('active');
        void wipeBar.offsetWidth;
        wipeBar.classList.add('active');
        setTimeout(swapFn, 300);
        wipeBar.addEventListener('animationend', function handler() {
          wipeBar.removeEventListener('animationend', handler);
          wipeBar.classList.remove('active');
          resolve();
        }, { once: true });
      });
    }

    function startRound() {
      round = buildRound(categoryKey, ROUND_SIZE);
      index = 0;
      score = 0;
      correctCount = 0;
      wrongCount = 0;
      ratios = [];
      leaderboardNote.textContent = '';
      quizPanel.hidden = false;
      resultsPanel.hidden = true;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const current = round[index];
      questionCounter.textContent = `Pregunta ${index + 1}/${round.length}`;
      scoreLabel.textContent = `Puntos: ${score}`;
      questionText.textContent = current.question;
      answersGrid.innerHTML = '';
      current.options.forEach(option => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-btn';
        button.textContent = option;
        button.addEventListener('click', () => handleAnswer(option, button));
        answersGrid.appendChild(button);
      });
      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      Audio.stopTick();
      deadline = Date.now() + TIME_LIMIT_MS;
      timerFill.style.width = '100%';
      timerFill.classList.remove('warning');
      timerId = setInterval(() => {
        const remaining = deadline - Date.now();
        const pct = Math.max(0, remaining / TIME_LIMIT_MS) * 100;
        timerFill.style.width = `${pct}%`;
        if (pct < 30) timerFill.classList.add('warning');
        if (remaining <= 5000 && remaining > 0) Audio.startTick();
        if (remaining <= 0) {
          clearInterval(timerId);
          Audio.stopTick();
          handleAnswer(null, null);
        }
      }, 100);
    }

    function handleAnswer(selected, button) {
      if (answered) return;
      answered = true;
      clearInterval(timerId);
      Audio.stopTick();
      const current = round[index];
      const remaining = Math.max(0, deadline - Date.now());
      const isCorrect = selected === current.correctAnswer;
      const points = computeScore(isCorrect, remaining, TIME_LIMIT_MS);
      score += points;
      ratios.push(remaining / TIME_LIMIT_MS);
      if (isCorrect) correctCount++; else wrongCount++;

      recordAnswer(stats, { category: categoryKey, isCorrect, remainingMs: remaining, timeLimitMs: TIME_LIMIT_MS });
      saveStats(stats);

      if (isCorrect) Audio.playCorrect(); else Audio.playWrong();

      [...answersGrid.children].forEach(child => {
        child.disabled = true;
        if (child.textContent === current.correctAnswer) {
          child.classList.add('correct');
          if (isCorrect && child === button) child.classList.add('flash-gold');
        } else if (child === button) {
          child.classList.add('wrong', 'shake-wrong');
        }
      });
      scoreLabel.textContent = `Puntos: ${score}`;
      setTimeout(() => wipeTransition(nextQuestion), 1200);
    }

    function nextQuestion() {
      index++;
      if (index >= round.length) showResults();
      else showQuestion();
    }

    async function showResults() {
      quizPanel.hidden = true;
      resultsPanel.hidden = false;
      resultCorrect.textContent = correctCount;
      resultWrong.textContent = wrongCount;
      resultScore.textContent = score;

      const avgRemainingRatio = ratios.reduce((sum, ratio) => sum + ratio, 0) / (ratios.length || 1);
      recordRoundEnd(stats, { category: categoryKey, correctCount, totalCount: round.length, score, avgRemainingRatio });
      saveStats(stats);

      const reward = reelsForScore(score);
      Wallet.add(reward);
      resultReels.textContent = reward;

      const user = getCurrentUser();
      if (user) {
        try {
          const improved = await submitScore(categoryKey, score);
          leaderboardNote.textContent = improved ? 'Nueva mejor puntuación enviada al ranking global.' : 'Puntuación registrada (no superó tu mejor marca).';
        } catch {
          leaderboardNote.textContent = 'No se pudo enviar la puntuación al ranking.';
        }
      } else {
        leaderboardNote.textContent = 'Inicia sesión para aparecer en el ranking global.';
      }
    }

    document.querySelector('#play-again').addEventListener('click', startRound);

    const achievementModal = document.querySelector('#achievement-modal');
    const achievementList = document.querySelector('#achievement-list');
    const CATEGORY_LABELS = Object.fromEntries(Object.entries(QUESTIONS).map(([key, value]) => [key, value.label]));
    function renderAchievements() {
      const state = getAchievementState(stats);
      let lastCategory = null;
      achievementList.innerHTML = state.map(item => {
        const heading = item.category !== lastCategory ? `<li style="margin-top:${lastCategory ? '10px' : '0'};font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;">${CATEGORY_LABELS[item.category]}</li>` : '';
        lastCategory = item.category;
        return `${heading}<li class="ach-item ${item.unlocked ? '' : 'locked'}"><span class="ach-medal ${item.medal}">${item.medal[0].toUpperCase()}</span><span class="ach-body"><strong>${item.name}</strong><span>${item.description}</span></span></li>`;
      }).join('');
    }
    document.querySelector('#trophy-open').addEventListener('click', () => { renderAchievements(); achievementModal.hidden = false; });
    document.querySelector('#achievement-close').addEventListener('click', () => { achievementModal.hidden = true; });

    startRound();
  </script>
</body>
</html>
